<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Swiss Quiz</title>
    <link rel="stylesheet" type="text/css" href="static/main.css" />
    <link rel="icon" href="./data/icon.png" />

    <script>
      const NBSP = "\u00a0";
      // Selected categories (at least one, all by default); filled on load
      const selected = new Set();
      let currentKey = null;

      function load_json(path) {
        return fetch(path).then((response) => response.json());
      }

      function rand_int(max) {
        return Math.floor(Math.random() * max);
      }

      function pick(data) {
        return data[rand_int(data.length)];
      }

      // Group thousands Swiss-style (12'345); other strings are kept as is.
      function fmt(value) {
        const s = String(value).replace(/\s/g, "");
        if (/^\d{4,}$/.test(s)) return s.replace(/\B(?=(\d{3})+$)/g, "'");
        return String(value);
      }

      // Each category: data promise and a function returning
      // {title, question, answer} for a random entry.
      const categories = {
        gem: {
          label: "Gemeinden",
          data: load_json("./data/gem.json"),
          make(row) {
            const name = `${row[0]} (${row[1]})`;
            if (rand_int(2) === 1) {
              return {
                title: name,
                question: `Wie viele Einwohner hat ${name}?`,
                answer: `${name} hat ${fmt(row[3])} Einwohner.`,
              };
            }
            return {
              title: name,
              question: `Wie gross ist die Fläche von ${name} (in km²)?`,
              answer: `${name} hat eine Fläche von ${row[4]} km².`,
            };
          },
        },
        mount: {
          label: "Berge",
          data: load_json("./data/mount.json"),
          make(row) {
            const name = row[0];
            if (rand_int(2) === 0) {
              return {
                title: name,
                question: `Wie hoch ist der Berg ${name} (in m)?`,
                answer: `Die Höhe des Berges ${name} ist ${row[1]} m.`,
              };
            }
            return {
              title: name,
              question: "Wie gross ist die Distanz zum nächsthöheren Punkt (in km)?",
              answer: `Die Distanz zum nächsthöheren Punkt ist ${row[2]} km.`,
            };
          },
        },
        lake: {
          label: "Seen",
          // Drop section rows and use area questions only where data exists
          data: load_json("./data/lakes.json").then((d) =>
            d.filter((r) => r.length === 5),
          ),
          make(row) {
            const name = row[1];
            const title = `${row[1]}, ${row[0]}`;
            if (row[3].trim() && rand_int(2) === 0) {
              return {
                title,
                question: `Wie gross ist der ${name} (in km²)?`,
                answer: `Der ${name} hat eine Fläche von ${row[3]} km².`,
              };
            }
            return {
              title,
              question: `Wie hoch liegt der ${name} (in m ü. M.)?`,
              answer: `Der ${name} liegt auf einer Höhe von ${row[4]}.`,
            };
          },
        },
        pass: {
          label: "Pässe",
          data: load_json("./data/pass.json"),
          make(row) {
            const name = row[0];
            const route = `Der Pass mit Namen ${name} führt von ${row[2]} (${row[1]}) nach ${row[4]} (${row[3]}). `;
            if (rand_int(2) === 0) {
              return {
                title: name,
                question: route + "Wie hoch liegt die Passhöhe (in m ü. M.)?",
                answer: `Die Passhöhe liegt auf ${row[5]} m ü. M.`,
              };
            }
            return {
              title: name,
              question: route + "Wie lange ist der Pass (in km)?",
              answer: `Der Pass ist ${row[6]} km lang.`,
            };
          },
        },
        river: {
          label: "Flüsse",
          data: load_json("./data/river.json"),
          make(row) {
            return {
              title: row[0],
              question: `Das fliessende Gewässer (${row[3]}) mit Namen ${row[0]} befindet sich in ${row[1]}. Wie lange ist das Gewässer (in km)?`,
              answer: `Das Gewässer hat eine Länge von ${row[2]}.`,
            };
          },
        },
      };

      const $ = (id) => document.getElementById(id);

      function setAnswerShown(shown) {
        $("answer").hidden = !shown;
        $("solve").disabled = shown;
      }

      function reload() {
        // Pick a category uniformly, then an item within it, so that every
        // selected category is equally likely regardless of its size.
        const key = pick([...selected]);
        const cat = categories[key];
        cat.data
          .then((data) => {
            const q = cat.make(pick(data));
            currentKey = key;
            $("quest").classList.remove("error");
            $("main_title").textContent = q.title;
            $("quest").textContent = q.question;
            $("answer").textContent = q.answer;
            setAnswerShown(false);
          })
          .catch(() => {
            $("main_title").textContent = "Fehler";
            $("quest").textContent = "Die Daten konnten nicht geladen werden.";
            $("quest").classList.add("error");
          });
      }

      function solve() {
        setAnswerShown(true);
      }

      function toggleCategory(key) {
        if (selected.has(key)) {
          if (selected.size === 1) return; // keep at least one selected
          selected.delete(key);
        } else {
          selected.add(key);
        }
        updateChips();
        // Keep the current question unless its category was deselected
        if (!selected.has(currentKey)) reload();
      }

      function updateChips() {
        for (const btn of document.querySelectorAll(".chip")) {
          btn.setAttribute("aria-pressed", String(selected.has(btn.dataset.key)));
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        const list = $("categories");
        for (const [key, cat] of Object.entries(categories)) {
          const li = document.createElement("li");
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "chip";
          btn.dataset.key = key;
          btn.textContent = cat.label;
          btn.addEventListener("click", () => toggleCategory(key));
          li.appendChild(btn);
          list.appendChild(li);
        }
        Object.keys(categories).forEach((key) => selected.add(key));
        updateChips();
        reload();
      });
    </script>
  </head>
  <body>
    <header class="site-header">
      <h1>Swiss Quiz</h1>
    </header>
    <main>
      <ul class="categories" id="categories" aria-label="Kategorien (Mehrfachauswahl)"></ul>
      <section class="card" aria-live="polite">
        <h2 id="main_title"></h2>
        <p class="question" id="quest"></p>
        <p class="answer" id="answer" hidden></p>
      </section>
    </main>
    <div class="actions">
      <button type="button" class="btn btn-secondary" id="solve" onclick="solve()">
        Auflösung
      </button>
      <button type="button" class="btn btn-primary" onclick="reload()">
        Neue Frage
      </button>
    </div>
  </body>
</html>
